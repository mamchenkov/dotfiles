# vim: set ft=i3config ts=4 sw=4 sts=4 expandtab :

#
# 2. Appearance (gaps, borders, colors, bar)
#

# Click to focus
focus_follows_mouse no

# Use Mouse+$mod to drag floating windows to their wanted position
floating_modifier $mod

# Do not show window borders at the edge of the screen
hide_edge_borders both

# Windows colors
#                          border           background       text                indicator
client.focused             $col-bg-active   $col-bg-active   $col-text-active    $col-indicator
client.unfocused           $col-bg-inactive $col-bg-inactive $col-text-inactive  $col-indicator
client.focused_inactive    $col-bg-inactive $col-bg-inactive $col-text-inactive  $col-indicator
client.urgent              $col-bg-urgent   $col-bg-urgent   $col-text-active    $col-indicator

# This font is widely installed, provides lots of unicode glyphs, right-to-left
# text rendering and scalability on retina/hidpi displays (thanks to pango).
# Font for window titles. Will also be used by the bar unless a different font
# is used in the bar {} block below.
#font pango:DejaVu Sans Mono 8
font pango:SauceCodePro Nerd Font Semibold 9

# Start i3bar to display a workspace bar (plus the system information i3status
# finds out, if available)
bar {
	font pango:SauceCodePro Nerd Font Semibold 8
		colors {
			background #2f343f
				statusline #2f343f
				separator #4b5262

				# colour of border, background, and text
				focused_workspace       #4b5262 #bfdbff #2f343f
				active_workspace        #4b5262 #2f343f #d8dee8
				inactive_workspace      #4b5262 #2f343f #d8dee8
				urgent_workspace        #4b5262 #f78f96 #2f343f
				binding_mode            #4b5262 #f78f96 #2f343f
		}
	#status_command /home/leonid/bin/i3status.sh
	#status_command i3status
	status_command i3blocks -c ~/.config/i3/i3blocks/i3blocks.conf 2>/dev/null
	#tray_output none
	#output primary
}


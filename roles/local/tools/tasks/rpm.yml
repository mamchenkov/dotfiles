---
# Manage RPM packages on Fedora/CentOS/RHEL.
# Use the generic package module so it works with dnf, dnf5, yum, etc.
- name: Manage RPM packages
  become: true
  ansible.builtin.package:
    name: "{{ item.name | default(item) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ rpms }}"
  tags:
    - packages
    - network

---
# Use Python3 on Fedora 30
ansible_python_interpreter: /usr/bin/python3

ansible_connection: local

# Base packages to be installed everywhere
# For parameters see:
# - http://docs.ansible.com/ansible/dnf_module.html
# - http://docs.ansible.com/ansible/yum_module.html
base_packages:
  # Base
  - bat
  - bash-completion
  - bash
  - bind-utils
  - grep
  - hstr
  - htop
  - mc
  - sysstat
  - rsync
  # Networking
  - mtr
  - net-tools
  - tcpdump
  - telnet
  # Terminal emulation
  - screen
  - tmux
  # HTTP
  - curl
  - httpie
  - links
  - wget
  # Git
  - git
  - git-extras
  - tig
  # Vim
  - ack
  - ctags
  - vim-enhanced

# Desktop avatar:
# Default behavior: pick ~/Pictures/Avatars/<username>.(jpg|jpeg|png|webp)
desktop_avatar_dir: "{{ ansible_user_dir }}/Pictures/Avatars"

# Optional override: if you set this, it wins over local files
# desktop_avatar_url: "https://example.com/avatar.jpg"

# Development packages to be installed on development workstations
# For parameters see:
# - http://docs.ansible.com/ansible/dnf_module.html
# - http://docs.ansible.com/ansible/yum_module.html
devel_packages:
  # PHP
  - php
  - php-bcmath
  - php-cli
  - php-common
  - php-gd
  - php-intl
  - php-ldap
  - php-mbstring
  - php-mysqlnd
  - php-opcache
  - php-pdo
  - php-pecl-apcu
  - php-pecl-xdebug
  - php-process
  - php-soap
  - php-xml
  # MySQL/MariaDB
  - mariadb
  - mariadb-server
  # NodeJS/NPM
  - npm
  # AWS CLI
  - aws

# geerlingguy.composer : Put in /usr/bin/
composer_path: /usr/bin/composer
# geerlingguy.composer : Keep updated to prevent outdated warnings
composer_keep_updated: true

# This playbook is for getting things which
# are useful on the graphical desktop.
---
- name: Desktop setup
  hosts: all
  pre_tasks:

    - name: Install the MATE desktop environment and Xorg on Fedora
      ansible.builtin.dnf:
        name:
          - "@mate-desktop-environment"
          - xorg-x11-server-Xorg
        state: present
      become: true
      when: ansible_distribution == "Fedora"
      tags:
        - packages

    - name: Install desktop tools
      include_role:
        name: tools
        tasks_from: rpm
      vars:
        rpms: "{{ desktop_packages }}"

    - name: Ensure dnf PR plugin is installed
      dnf:
        name: dnf-plugins-core
        state: "{{ package_state_default }}"
      become: true

    - name: Enable COPR repo for rofi (yaroslav/i3desktop) on older Fedora
      command: dnf -y copr enable yaroslav/i3desktop
      when: ansible_distribution == "Fedora" and (ansible_distribution_major_version | int) < 43

    - name: Install rofi from COPR repository
      dnf:
        name: rofi
        enablerepo: yaroslav/i3desktop
        state: "{{ package_state_default }}"
      become: true

    - name: Read the packaged desktop portal unit
      ansible.builtin.slurp:
        src: /usr/lib/systemd/user/xdg-desktop-portal.service
      register: packaged_desktop_portal_unit

    - name: Determine whether the desktop portal workaround is needed
      ansible.builtin.set_fact:
        desktop_portal_workaround_needed: >-
          {{ 'Requisite=graphical-session.target' in
          (packaged_desktop_portal_unit.content | b64decode) }}

    - name: Setup desktop files in /home folder
      include_role:
        name: tools
        tasks_from: file
      vars:
        files_src: "home/desktop/"
        files_dst: "{{ ansible_user_dir }}"
        files_rsync_opts: >-
          {{ [] if desktop_portal_workaround_needed else
          ['--exclude=.config/systemd/user/xdg-desktop-portal.service'] }}

    - name: Remove the desktop portal workaround after Fedora fixes the regression
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.config/systemd/user/xdg-desktop-portal.service"
        state: absent
      when: not desktop_portal_workaround_needed

    - name: Enable Flathub system-wide
      community.general.flatpak_remote:
        name: flathub
        flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
        method: system
        state: present
      become: true
      tags:
        - packages

    - name: Install desktop applications from Flathub
      community.general.flatpak:
        name: "{{ desktop_flatpaks }}"
        remote: flathub
        method: system
        state: present
      become: true
      tags:
        - packages

    - name: Read Flatpak filesystem overrides
      ansible.builtin.command:
        argv:
          - flatpak
          - override
          - --user
          - --show
          - "{{ item }}"
      loop: "{{ desktop_flatpaks }}"
      register: desktop_flatpak_overrides
      changed_when: false

    - name: Grant Flatpak desktop applications access to the home directory
      ansible.builtin.command:
        argv:
          - flatpak
          - override
          - --user
          - --filesystem=home
          - "{{ item }}"
      loop: "{{ desktop_flatpaks }}"
      loop_control:
        index_var: flatpak_index
      when: >-
        'filesystems=home;' not in
        desktop_flatpak_overrides.results[flatpak_index].stdout

    - name: Reload and start the desktop portal
      ansible.builtin.systemd_service:
        name: xdg-desktop-portal.service
        scope: user
        daemon_reload: true
        state: started

    - name: Find user avatar image by username in Avatars folder
      ansible.builtin.find:
        paths: "{{ desktop_avatar_dir | default(ansible_user_dir ~ '/Pictures/Avatars') }}"
        patterns:
          - "{{ ansible_user_id }}.jpg"
          - "{{ ansible_user_id }}.jpeg"
          - "{{ ansible_user_id }}.png"
          - "{{ ansible_user_id }}.webp"
        file_type: file
        recurse: false
      register: avatar_matches

    - name: Pick detected avatar file (first match)
      set_fact:
        desktop_avatar_file_detected: >-
          {{ (avatar_matches.files
          | sort(attribute='path')
          | map(attribute='path')
          | list
          | first) | default('') }}

    - name: Ensure ~/.face is set from avatar URL (if provided)
      get_url:
        url: "{{ desktop_avatar_url }}"
        dest: "{{ ansible_user_dir }}/.face"
        mode: "0644"
      when: desktop_avatar_url is defined and desktop_avatar_url | length > 0

    - name: Fail if no local avatar file found and no URL provided
      fail:
        msg: "No avatar found for '{{ ansible_user_id }}' in {{ desktop_avatar_dir | default(ansible_user_dir ~ '/Pictures/Avatars') }}. Expected one of: {{ ansible_user_id }}.jpg, {{ ansible_user_id }}.jpeg, {{ ansible_user_id }}.png, {{ ansible_user_id }}.webp"
      when:
        - desktop_avatar_url is not defined or desktop_avatar_url | length == 0
        - desktop_avatar_file_detected | length == 0

    - name: Ensure ~/.face is a symlink to detected avatar file (default)
      file:
        src: "{{ desktop_avatar_file_detected }}"
        dest: "{{ ansible_user_dir }}/.face"
        state: link
        force: true
      when:
        - desktop_avatar_url is not defined or desktop_avatar_url | length == 0
        - desktop_avatar_file_detected | length > 0


    - name: Check current MATE window manager
      command: dconf read /org/mate/desktop/session/required-components/windowmanager
      register: mate_wm
      changed_when: false

    - name: Ensure MATE uses i3 as window manager
      become: false
      command:
        dconf write /org/mate/desktop/session/required-components/windowmanager "'i3'"
      when: mate_wm.stdout.strip() != "'i3'"

    - name: Add Google Linux signing key (Fedora)
      ansible.builtin.rpm_key:
        state: present
        key: https://dl.google.com/linux/linux_signing_key.pub
      become: true
      when: ansible_distribution == "Fedora"

    - name: Add Google Chrome repository (Fedora)
      ansible.builtin.yum_repository:
        name: google-chrome
        description: Google Chrome - x86_64
        baseurl: https://dl.google.com/linux/chrome/rpm/stable/x86_64
        enabled: true
        gpgcheck: true
        gpgkey: https://dl.google.com/linux/linux_signing_key.pub
      become: true
      when: ansible_distribution == "Fedora"

    - name: Install Google Chrome (Fedora)
      ansible.builtin.dnf:
        name: google-chrome-stable
        state: present
        update_cache: true
      become: true
      when: ansible_distribution == "Fedora"
